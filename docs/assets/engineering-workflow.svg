<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="546" viewBox="0 0 1280 546" role="img" aria-labelledby="title desc">
<title id="title">Prepared engineering workflow</title><desc id="desc">Prepare, preview, checkpoint, apply and verify. Checkpointing saves all current project edits. Partial failures and uncertain outcomes need explicit reconciliation and recovery.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#171717"/></marker></defs>
<rect x="2" y="2" width="1276" height="542" fill="#f2f0e8" stroke="#171717" stroke-width="3"/>
<rect x="2" y="2" width="1276" height="92" fill="#171717" stroke="#171717" stroke-width="3"/><text x="32" y="62" fill="#dfff00" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900">CHANGE WITH A RECORD.</text><rect x="37" y="151" width="226" height="229" fill="#171717" stroke="#171717" stroke-width="3"/><rect x="32" y="146" width="226" height="229" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><rect x="32" y="146" width="226" height="43" fill="#dfff00" stroke="#171717" stroke-width="3"/><text x="46" y="175" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="900">01 / PREPARE</text><text x="46" y="238" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Read the exact target.</text><text x="46" y="273" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Validate scope.</text><text x="46" y="308" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Capture originals.</text><path d="M258 262H275V262" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="283" y="151" width="226" height="229" fill="#171717" stroke="#171717" stroke-width="3"/><rect x="278" y="146" width="226" height="229" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><rect x="278" y="146" width="226" height="43" fill="#dfff00" stroke="#171717" stroke-width="3"/><text x="292" y="175" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="900">02 / PREVIEW</text><text x="292" y="238" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Review the effects.</text><text x="292" y="273" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Inspect warnings.</text><text x="292" y="308" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Bind the preview hash.</text><path d="M504 262H521V262" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="529" y="151" width="226" height="229" fill="#171717" stroke="#171717" stroke-width="3"/><rect x="524" y="146" width="226" height="229" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><rect x="524" y="146" width="226" height="43" fill="#dfff00" stroke="#171717" stroke-width="3"/><text x="538" y="175" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="900">03 / CHECKPOINT</text><text x="538" y="238" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Save current edits.</text><text x="538" y="273" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Archive the project.</text><text x="538" y="308" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Record its hash.</text><path d="M750 262H767V262" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="775" y="151" width="226" height="229" fill="#171717" stroke="#171717" stroke-width="3"/><rect x="770" y="146" width="226" height="229" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><rect x="770" y="146" width="226" height="43" fill="#dfff00" stroke="#171717" stroke-width="3"/><text x="784" y="175" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="900">04 / APPLY</text><text x="784" y="238" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Recheck the target.</text><text x="784" y="273" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Apply the reviewed plan.</text><text x="784" y="308" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Record each stage.</text><path d="M996 262H1013V262" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1021" y="151" width="226" height="229" fill="#171717" stroke="#171717" stroke-width="3"/><rect x="1016" y="146" width="226" height="229" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><rect x="1016" y="146" width="226" height="43" fill="#dfff00" stroke="#171717" stroke-width="3"/><text x="1030" y="175" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="900">05 / VERIFY</text><text x="1030" y="238" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Inspect the result.</text><text x="1030" y="273" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Review diagnostics.</text><text x="1030" y="308" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Reconcile uncertainty.</text><text x="32" y="425" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900">A checkpoint saves the entire current project, including unsaved user edits.</text><text x="32" y="466" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Changes can partially fail. Inspect the journal and recover explicitly; never replay an uncertain outcome.</text><text x="32" y="507" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Compilation and saving follow the operation requirements and the explicit apply options.</text>
</svg>
