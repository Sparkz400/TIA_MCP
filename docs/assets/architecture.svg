<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="696" viewBox="0 0 1280 696" role="img" aria-labelledby="title desc">
<title id="title">TIA MCP architecture</title><desc id="desc">An MCP client uses the Windows .NET 10 Host. The Host handles portable document workflows and communicates with isolated .NET Framework 4.8 workers for TIA Portal V21 and PLCSIM Advanced V8.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#171717"/></marker></defs>
<rect x="2" y="2" width="1276" height="692" fill="#f2f0e8" stroke="#171717" stroke-width="3"/>
<rect x="2" y="2" width="1276" height="92" fill="#171717" stroke="#171717" stroke-width="3"/><text x="32" y="62" fill="#dfff00" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900">HOW IT CONNECTS.</text><rect x="39" y="153" width="236" height="140" fill="#171717" stroke="#171717" stroke-width="3"/><rect x="32" y="146" width="236" height="140" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><text x="52" y="187" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900">MCP CLIENT</text><text x="52" y="222" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Requests + responses</text><rect x="357" y="153" width="296" height="140" fill="#171717" stroke="#171717" stroke-width="3"/><rect x="350" y="146" width="296" height="140" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><text x="370" y="187" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900">HOST</text><text x="370" y="222" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">.NET 10 / Windows</text><rect x="735" y="153" width="520" height="140" fill="#171717" stroke="#171717" stroke-width="3"/><rect x="728" y="146" width="520" height="140" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><text x="748" y="187" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900">ISOLATED WORKERS</text><text x="748" y="222" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">.NET Framework 4.8</text><text x="370" y="258" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="400">stdio / tool routing</text><text x="748" y="258" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="900">TIA V21</text><text x="1010" y="258" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="900">SIMULATOR V8</text><path d="M268 211H342V211" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M646 211H720V211" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="656" y="192" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="400">IPC</text><path d="M495 293H495V375" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M846 293H846V375" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1112 293H1112V375" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="32" y="382" width="614" height="194" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><rect x="32" y="382" width="614" height="49" fill="#dfff00" stroke="#171717" stroke-width="3"/><text x="52" y="414" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900">PORTABLE / NO SIEMENS INSTALLATION</text><text x="52" y="467" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Supplied documents + saved project reviews</text><text x="52" y="504" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Reports, comparisons + portable Explorer</text><text x="52" y="545" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400">Portable package disables native workers.</text><rect x="728" y="382" width="244" height="194" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><text x="748" y="425" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900">TIA PORTAL</text><text x="748" y="459" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">V21 + Openness</text><text x="748" y="502" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Offline project</text><text x="748" y="531" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">engineering</text><rect x="1004" y="382" width="244" height="194" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><text x="1024" y="425" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900">PLCSIM</text><text x="1024" y="459" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Advanced V8</text><text x="1024" y="502" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Owned simulator</text><text x="1024" y="531" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">instances</text><text x="32" y="623" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Installed Siemens products supply their own assemblies and licenses.</text><text x="32" y="658" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400">Architecture is not a claim of qualification for every target or operation.</text>
</svg>
