<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">TIA MCP — Inspect. Preview. Change. Verify.</title>
  <desc id="desc">Brutalist industrial banner: oversized black typography, an off-white engineering grid, acid-yellow workflow panels, and a hard-edged schematic connecting an MCP client to an offline PLC project.</desc>
