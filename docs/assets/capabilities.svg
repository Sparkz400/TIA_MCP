<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="632" viewBox="0 0 1280 632" role="img" aria-labelledby="title desc">
<title id="title">TIA MCP capability boundaries</title><desc id="desc">Portable document workflows do not require Siemens. Fresh native capture, engineering and simulation require installed products. Current evidence determines feature, target and release qualification.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#171717"/></marker></defs>
<rect x="2" y="2" width="1276" height="628" fill="#f2f0e8" stroke="#171717" stroke-width="3"/>
<rect x="2" y="2" width="1276" height="92" fill="#171717" stroke="#171717" stroke-width="3"/><text x="32" y="62" fill="#dfff00" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900">KNOW THE BOUNDARY.</text><rect x="38" y="146" width="384" height="359" fill="#171717" stroke="#171717" stroke-width="3"/><rect x="32" y="140" width="384" height="359" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><rect x="32" y="140" width="384" height="54" fill="#dfff00" stroke="#171717" stroke-width="3"/><text x="49" y="176" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="900">01 / PORTABLE</text><text x="49" y="228" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="900">NO SIEMENS INSTALLATION</text><text x="49" y="277" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Saved project reviews</text><text x="49" y="316" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Supplied XML / JSON / CSV</text><text x="49" y="355" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Document comparisons</text><text x="49" y="394" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Portable Explorer + reports</text><text x="49" y="469" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="400">Uses supplied or saved data.</text><rect x="454" y="146" width="384" height="359" fill="#171717" stroke="#171717" stroke-width="3"/><rect x="448" y="140" width="384" height="359" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><rect x="448" y="140" width="384" height="54" fill="#dfff00" stroke="#171717" stroke-width="3"/><text x="465" y="176" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="900">02 / ENGINEERING</text><text x="465" y="228" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="900">INSTALLED SIEMENS PRODUCTS</text><text x="465" y="277" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Fresh native project capture</text><text x="465" y="316" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Supported prepared changes</text><text x="465" y="355" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">PLC program compilation</text><text x="465" y="394" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Owned PLCSIM simulation</text><text x="465" y="469" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="400">Target, options + licenses apply.</text><rect x="870" y="146" width="384" height="359" fill="#171717" stroke="#171717" stroke-width="3"/><rect x="864" y="140" width="384" height="359" fill="#f2f0e8" stroke="#171717" stroke-width="3"/><rect x="864" y="140" width="384" height="54" fill="#dfff00" stroke="#171717" stroke-width="3"/><text x="881" y="176" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="900">03 / QUALIFICATION</text><text x="881" y="228" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="900">CHECK THE CURRENT EVIDENCE</text><text x="881" y="277" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Feature-specific native results</text><text x="881" y="316" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">CPU / firmware coverage</text><text x="881" y="355" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Destination + VM validation</text><text x="881" y="394" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Physical / release acceptance</text><text x="881" y="469" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="400">Implementation is not acceptance.</text><text x="32" y="553" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900">Requirements and evidence categories — not a live pass/fail dashboard.</text><text x="32" y="594" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Use Current status, feature_catalog and target_capabilities for the exact supported scope.</text>
</svg>
