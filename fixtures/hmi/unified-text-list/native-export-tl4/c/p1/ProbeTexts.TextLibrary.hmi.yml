#Version: 2.0
TextLibraries:
  "ProbeTextsTexts":
    Type: Text
    Languages:
      - "en-US"
      - "de-DE"
    DefaultLanguage: "en-US"
    Entries:
      "Quote":
        Text:
          - "\"quoted\" \\ backslash"
          - "\"quoted\" \\ backslash DE"
      "Whitespace":
        Text:
          - "tab\u0009here\u000aLF"
          - "tab\u0009here\u000aLF DE"
      "Unicode":
        Text:
          - "Über 日本語 😀"
          - "Über 日本語 😀 DE"
      "Empty":
        Text:
          - ""
          - ""
      "Yaml":
        Text:
          - "---\u000a!tag &anchor #hash: colon"
          - "---\u000a!tag &anchor #hash: colon DE"
      "Separators":
        Text:
          - "x\u2028y\u2029z"
          - "x\u2028y\u2029z DE"
      "Long":
        Text:
          - ""
          - " DE"
      "F00AD":
        Text:
          - "a­b"
          - "a­b DE"
      "F200B":
        Text:
          - "a​b"
          - "a​b DE"
      "F200D":
        Text:
          - "a‍b"
          - "a‍b DE"
      "FFEFF":
        Text:
          - "a﻿b"
          - "a﻿b DE"
      "F202E":
        Text:
          - "a‮b"
          - "a‮b DE"
      "F2060":
        Text:
          - "a⁠b"
          - "a⁠b DE"
