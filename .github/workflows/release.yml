name: Release

# Version tags only. Requires passed offline (code jobs run, not skipped) and Explorer runs on the tagged commit, packages and
# strictly verifies the offline bundle, attests the ZIP's build provenance and an SPDX SBOM of its contents and creates a DRAFT release; the maintainer
# reviews and publishes it (docs/guides/releasing.md).
# It never publishes a release, creates a tag or pushes.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    name: Tagged commit passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # gh run list and the jobs of those runs only
    steps:
      - name: Require successful offline and Explorer runs on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # main already ran both workflows on this commit; tag it only after they pass.
          passed=$(gh run list --workflow playwright.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          test "$passed" -gt 0 || { echo "No successful playwright.yml run on $GITHUB_SHA."; exit 1; }
          # A successful offline.yml run proves nothing by itself: a docs-only push skips the Python, package and OPC UA
          # jobs and still concludes success, and its managed and worker jobs succeed with every step skipped. These
          # five jobs run only when the change scope is code (then the managed and worker steps run too), so one run
          # must show each of them as passed; a skipped matrix reports one unexpanded name and matches none.
          # test_ci_workflows.py keeps the names in step with offline.yml. Pull request runs do not count: they may
          # run the package job in quick mode.
          ran_code='["Python harnesses (shard 0/3)", "Python harnesses (shard 1/3)", "Python harnesses (shard 2/3)",
            "Portable package and relocation", "OPC UA isolated parser and CLI"] as $required
            | [.jobs[] | select(.conclusion == "success") | .name] as $passed
            | $required | all(. as $name | $passed | index($name) != null)'
          runs=$(gh run list --workflow offline.yml --commit "$GITHUB_SHA" --status success --limit 100 --json databaseId,event --jq '.[] | select(.event != "pull_request") | .databaseId')
          full=
          for run in $runs; do
            verdict=$(gh api "repos/$GH_REPO/actions/runs/$run/jobs?per_page=100" --jq "$ran_code") || verdict=error
            echo "offline.yml run $run: code jobs passed: $verdict"
            if [ "$verdict" = true ]; then full=$run; fi
          done
          test -n "$full" || {
            echo "No successful offline.yml run on $GITHUB_SHA ran the code jobs (a docs-only push skips them)."
            echo "Start a full one with: gh workflow run offline.yml --ref $GITHUB_REF_NAME, and re-run this job once it passed."
            exit 1
          }

  build:
    name: Package and verify
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read # NuGet restore and dotnet build run here, so no write token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # acceptance records bind the matrix and frozen inputs of a reviewed ancestor
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.402' # Published SDK; avoid unavailable latestFeature redirects.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Package, verify and stage the release files
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $bundle = ./scripts/Package.ps1 -Offline
          $verified = ./scripts/Verify-TiaMcpBundle.ps1 -BundlePath $bundle -Strict
          $version = $verified.productVersion
          if ($env:TAG -cne "v$version") { throw "Tag $env:TAG does not name the bundle's product version $version." }
          # From 1.0 on the ledger must be release-ready with no open or deferred cell.
          python -B scripts/release_matrix.py --release-gate $version
          if ($LASTEXITCODE -ne 0) { throw "Release gate refused $version." }
          # From 1.0 on the bundle's Host must keep the frozen surface of contracts/mcp-surface.v1.json (contract freeze policy).
          python -m pip install -r scripts/requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installing scripts/requirements-test.txt failed.' }
          $surface = Join-Path $env:RUNNER_TEMP 'mcp-surface'
          python -B scripts/test_mcp_surface_host.py --host (Join-Path $bundle 'host/TiaMcp.Host.exe') --output $surface
          if ($LASTEXITCODE -ne 0) { throw 'MCP surface discovery of the bundled Host failed.' }
          python -B scripts/mcp_surface.py check --surface (Join-Path $surface 'surface.json')
          if ($LASTEXITCODE -ne 0) { throw "Surface gate refused $version." }
          $section = [regex]::Match((Get-Content -LiteralPath CHANGELOG.md -Raw), '(?ms)^## \[' + [regex]::Escape($version) + '\][^\n]*\n(.*?)(?=^## \[|\z)')
          if (-not $section.Success) { throw "CHANGELOG.md has no [$version] section." }
          $stage = Join-Path $env:RUNNER_TEMP 'release-files'
          New-Item -ItemType Directory -Path $stage | Out-Null
          $section.Groups[1].Value.Trim() | Set-Content -LiteralPath (Join-Path $stage 'release-notes.md') -Encoding UTF8
          Copy-Item -LiteralPath (Join-Path $bundle 'manifest.json') -Destination (Join-Path $stage ((Split-Path $bundle -Leaf) + '.manifest.json'))
          Copy-Item -LiteralPath "$bundle.zip", "$bundle.zip.sha256" -Destination $stage
          "RELEASE_FILES=$stage" | Add-Content -LiteralPath $env:GITHUB_ENV
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ env.RELEASE_FILES }}
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Build provenance and SBOM
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore signing certificate for this workflow run
      attestations: write # store the attestations; nothing is built or checked out here
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      # Binds the ZIP's SHA-256 to this repository, workflow and tag; check with
      # `gh attestation verify <zip> --repo Sparkz400/TIA_MCP`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-files/*.zip
      - name: Expand the ZIP that will be published
        id: bundle
        shell: bash
        run: |
          # Catalogue the uploaded ZIP's own contents (assemblies and their .deps.json), not the build folder.
          zips=(release-files/*.zip)
          test "${#zips[@]}" -eq 1 && test -f "${zips[0]}" || { echo "Expected exactly one ZIP in the build artifact."; exit 1; }
          name=$(basename "${zips[0]}" .zip)
          mkdir -p "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/sbom"
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/bundle"
          echo "dir=$RUNNER_TEMP/bundle" >> "$GITHUB_OUTPUT"
          echo "sbom=$RUNNER_TEMP/sbom/$name.spdx.json" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: ${{ steps.bundle.outputs.dir }}
          format: spdx-json
          syft-version: v1.57.0 # exact, so a new Syft release cannot change the SBOM unnoticed
          output-file: ${{ steps.bundle.outputs.sbom }}
          upload-artifact: false # uploaded below under a fixed name for the draft job
          upload-release-assets: false # the draft job attaches it; this job has no contents permission
          dependency-snapshot: false
      # Binds the SBOM to the same ZIP digest; check with
      # `gh attestation verify <zip> --repo Sparkz400/TIA_MCP --predicate-type https://spdx.dev/Document/v2.3`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-files/*.zip
          sbom-path: ${{ steps.bundle.outputs.sbom }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: ${{ steps.bundle.outputs.sbom }}
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft release
    needs: [build, attest] # no draft without provenance for its ZIP
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create --draft only; nothing is built here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      # The attest job's SBOM of the ZIP's contents, published as a release asset next to the ZIP.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: release-files
      - name: Verify the uploaded ZIP and draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = @(Get-ChildItem -LiteralPath release-files -Filter '*.zip')
          if ($zip.Count -ne 1) { throw 'Expected exactly one ZIP in the build artifact.' }
          $expected = ((Get-Content -LiteralPath "$($zip[0].FullName).sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash -ine $expected) { throw 'ZIP does not match its .sha256 file.' }
          # Verify what will be uploaded, not the folder it was built from.
          $expanded = Join-Path $env:RUNNER_TEMP 'expanded'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $expanded
          $verified = ./scripts/Verify-TiaMcpBundle.ps1 -BundlePath $expanded -Strict
          $version = $verified.productVersion
          if ($env:TAG -cne "v$version") { throw "Tag $env:TAG does not name the bundle's product version $version." }
          $files = @(Get-ChildItem -LiteralPath release-files -File | ForEach-Object { $_.FullName } | Where-Object { $_ -notlike '*release-notes.md' })
          $flags = @('--draft', '--verify-tag', '--title', "TIA MCP $version", '--notes-file', 'release-files/release-notes.md')
          if ($version -match '^0\.|-') { $flags += '--prerelease' }
          gh release create $env:TAG @files @flags
          if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release failed.' }
