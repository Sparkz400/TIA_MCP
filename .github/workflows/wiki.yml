name: Wiki sync

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

# docs/wiki is the wiki's source; this mirrors it, so edits made on the wiki are overwritten.
jobs:
  sync:
    name: Publish docs/wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Mirror docs/wiki into the repository wiki
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          rsync -a --delete --exclude .git docs/wiki/ "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date."; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Sync from ${GITHUB_SHA}"
          git push
