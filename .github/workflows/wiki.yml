name: Wiki sync

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

# Each job names what it needs.
permissions: {}

concurrency:
  group: wiki
  cancel-in-progress: false

# docs/wiki is the wiki's source; this mirrors it, so edits made on the wiki are overwritten.
jobs:
  sync:
    name: Publish docs/wiki
    # A manual run from a feature branch must not publish that branch's pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push to the repository wiki
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the push below passes the token itself
      - name: Mirror docs/wiki into the repository wiki
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          rsync -a --delete --exclude .git docs/wiki/ "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date."; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Sync from ${GITHUB_SHA}"
          git push
