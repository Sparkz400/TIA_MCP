name: Explorer validation
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: explorer-${{ github.ref }}
  # Only superseded PR pushes are cancelled; every main push finishes with a verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  explorer:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Chromium
      run: npx playwright install --with-deps chromium
    - name: Validate explorer model and client
      run: npm run test:explorer
    - name: Validate the actual offline and MCP explorer
      run: npm run test:explorer:browser
    - name: Validate the explorer at 1,000 functions (synthetic snapshot)
      run: npm run test:explorer:scale
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: explorer-evidence
        path: |
          artifacts/project-explorer/runs/
          output/playwright/project-explorer/
          artifacts/project-explorer/scale-runs/
          output/playwright/project-explorer-scale/
        retention-days: 30
