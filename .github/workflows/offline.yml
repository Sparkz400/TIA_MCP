name: Python and .NET validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly full run, including every packaged workflow stage.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Scripts read UTF-8 JSON and text; never fall back to the runner's ANSI code page.
  PYTHONUTF8: '1'

concurrency:
  # Pull requests share one group per branch, so a new push cancels the superseded run. Every other run (main pushes,
  # tags, nightly, manual) gets a group of its own: a shared group keeps only one pending run and cancels the others,
  # which lost the verdict of a merge that broke main.
  group: offline-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Hosted runners execute only the offline allowlist. Native Siemens builds and
# live qualification remain explicit engineering-workstation tasks.
jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      host: ${{ steps.scope.outputs.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none # git diff --name-only compares trees only
      - id: scope
        name: Detect documentation-only changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Anything outside docs/** and top-level Markdown counts as code; unknown ranges run everything.
          if [ "$EVENT" = pull_request ]; then range="origin/$BASE_REF...HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"
          else echo "code=true" >> "$GITHUB_OUTPUT"; echo "host=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$range")
          code=$(printf '%s\n' "$files" | grep -v -E '^docs/|^[^/]+\.md$' | grep -c . || true)
          if [ -z "$files" ] || [ "$code" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          # Host, Core, the MCP surface and the packaging scripts are what the full packaged workflow stages exercise;
          # the quick package smoke skips them, and every main failure since mid-November came from those stages.
          host=$(printf '%s\n' "$files" | grep -c -E '^src/TiaMcp\.(Host|Core)/|^contracts/mcp-surface|^scripts/(Package|New-IsolatedBuild|Test-OfflinePackage|Verify-TiaMcpBundle|Start-TiaMcp)\.ps1$|^scripts/test_[^/]*(host|session|mcp)[^/]*\.py$' || true)
          if [ -z "$files" ] || [ "$host" -gt 0 ]; then echo "host=true" >> "$GITHUB_OUTPUT"; else echo "host=false" >> "$GITHUB_OUTPUT"; fi
          printf 'Changed files:\n%s\n' "$files"

  lint:
    name: Static lint
    # No scope condition: the analyzer finishes in seconds and a docs-only change cannot break it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          # Exact version: a new analyzer release must not turn main red by itself.
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -ErrorAction Stop
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -ErrorAction Stop
          # Invoke-ScriptAnalyzer reports findings without failing, so count them.
          $findings = @(Get-ChildItem -LiteralPath scripts -Filter *.ps1 -File | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error, ParseError })
          $findings | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap | Out-String -Width 220 | Write-Host
          if ($findings.Count -gt 0) { throw "PSScriptAnalyzer reported $($findings.Count) error(s)." }

  # release.yml takes the success of the python-shard, package and opcua jobs as proof that a run tested code;
  # keep their names and their job-level scope condition in step with its `checks` job (test_ci_workflows.py).
  python-shard:
    name: Python harnesses (shard ${{ matrix.shard }}/3)
    needs: changes
    # Only the aggregate `python` check is required, so docs-only changes may skip the whole matrix.
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Test-Offline.ps1 assigns every test file to exactly one shard; contract checks run in shard 0.
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # test_contracts.py requires each cited evidence commit to be an ancestor of HEAD.
          fetch-depth: 0
          # Full history, but blobs load on demand: the ancestry checks need commits, not old file contents.
          filter: blob:none
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt
      - name: Validate contracts and Python harnesses
        shell: pwsh
        run: |
          python -m pip install -r scripts/requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installing scripts/requirements-test.txt failed.' }
          ./scripts/Test-Offline.ps1 -Suite Python -ShardCount 3 -ShardIndex ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: python-validation-${{ matrix.shard }}
          path: artifacts/offline-validation/
          retention-days: 14

  python:
    # Keeps the required check name stable across the shard split.
    name: Python contracts and harnesses
    needs: [changes, python-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Python shard to pass
        env:
          RESULT: ${{ needs.python-shard.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          # Skipped counts only when the scope job decided docs-only, not when it failed.
          test "$RESULT" = success || { test "$RESULT" = skipped && test "$CODE" = false; } || { echo "Python shards: $RESULT (code=$CODE)"; exit 1; }

  managed:
    name: .NET managed suites (shard ${{ matrix.shard }}/4)
    needs: changes
    # Run the job even for docs-only changes so the four required shard checks report;
    # a skipped matrix job reports one unexpanded name instead.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Test-Offline.ps1 assigns every suite to exactly one shard.
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            .packages
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', 'global.json', 'NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          dotnet-version: '10.0.402' # Published SDK; avoid unavailable latestFeature redirects.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt
      - name: Install schema and lifecycle dependencies
        if: needs.changes.outputs.code == 'true'
        run: python -m pip install -r scripts/requirements-test.txt
      - name: Build and run managed suites
        if: needs.changes.outputs.code == 'true'
        shell: pwsh
        run: ./scripts/Test-Offline.ps1 -Suite Managed -ShardCount 4 -ShardIndex ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ needs.changes.outputs.code == 'true' && !cancelled() }}
        with:
          name: managed-validation-${{ matrix.shard }}
          path: |
            artifacts/offline-validation/*/result.json
            artifacts/offline-validation/*/validation.log
            artifacts/offline-validation/*/general-managed.log
            artifacts/offline-validation/*/project-index-store-tests.json
            artifacts/offline-validation/*/physical-runtime-results.json
            artifacts/offline-validation/*/runtime-session-mcp/*.json
            artifacts/offline-validation/*/hmi-component-mcp/*.json
            artifacts/offline-validation/*/hmi-component-mcp/host-artifacts/hmi-component-reviews/**
            artifacts/offline-validation/*/hmi-component-mcp/host-artifacts/project-reviews/**
            artifacts/offline-validation/*/runtime-session-mcp/store/**
            artifacts/offline-validation/*/access/capture-handoff/**
            artifacts/offline-validation/*/access/runtime-captures/**
            artifacts/offline-validation/*/composite-engineering/**
            artifacts/offline-validation/*/access/handoff/**
            artifacts/offline-validation/*/access/handoff-workflow/**
            artifacts/offline-validation/*/access/runtime-handoff/**
            artifacts/offline-validation/*/access/access-reviews/**
            artifacts/offline-validation/*/access/project-reviews/**
            artifacts/offline-validation/*/runtime-handoff-mcp/store/runtime-handoff/**
            artifacts/offline-validation/*/runtime-handoff-mcp/store/access-reviews/**
            artifacts/offline-validation/*/runtime-handoff-mcp/store/project-reviews/**
            artifacts/offline-validation/*/access/handoff-child-*.log
            artifacts/offline-validation/*/access/verification.json
            artifacts/offline-validation/*/drive-profiles/verification.json
            artifacts/offline-validation/*/drive-profiles/telegrams-v2/**
            artifacts/offline-validation/*/technology-profiles/verification.json
            artifacts/offline-validation/*/technology-profiles/encoders-v4/**
            artifacts/offline-validation/*/addin-owner-framework/result.json
            artifacts/offline-validation/*/addin-sandbox/result.json
            artifacts/offline-validation/*/addin-handoff-lifecycle.json
            artifacts/offline-validation/*/addin-receiver-processes.json
            artifacts/offline-validation/*/addin-receiver-host/*.json
            artifacts/offline-validation/*/temp/tia-handoff-*/*.status.json
            artifacts/offline-validation/*/temp/tia-handoff-*/*.receiver.json
            artifacts/offline-validation/*/temp/tia-handoff-*/receiver-fixture.json
            artifacts/offline-validation/*/temp/tia-handoff-*/authority-calls.log
            artifacts/offline-validation/*/temp/tia-handoff-*/addin-handoffs/receiver.json
            artifacts/offline-validation/*/temp/tia-handoff-*/addin-handoffs/*/*.json
            artifacts/offline-validation/*/temp/tia-handoff-*/addin-handoffs/*/selection.input
            artifacts/offline-validation/*/temp/tia-handoff-*/project-reviews/*.json
            artifacts/offline-validation/*/temp/tia-handoff-*/addin-selections/*
            artifacts/offline-validation/*/*-schema.json
            artifacts/offline-validation/*/*-mcp.json
            artifacts/offline-validation/*/mcp-surface/*.json
            artifacts/offline-validation/*/*-mcp/verification.json
            artifacts/offline-validation/*/*-mcp/result.json
            artifacts/offline-validation/*/credentials/recovery/verification.json
            artifacts/offline-validation/*/credentials/operations/verification.json
            artifacts/offline-validation/*/credentials/verification.json
            artifacts/offline-validation/*/credential-cli/verification.json
          retention-days: 14

  package:
    name: Portable package and relocation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    # Full hosted runs took 17-20 minutes before the fixture suites were built once; 20 cancelled them at the limit.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .packages
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', 'global.json', 'NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.402' # Published SDK; avoid unavailable latestFeature redirects.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt
      - name: Validate portable package without Siemens
        shell: pwsh
        env:
          # Pull requests run the packaging smoke unless they touch the Host, Core, the MCP surface or the packaging
          # scripts; main, nightly and manual runs always exercise every packaged workflow.
          PACKAGE_MODE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.host != 'true' && 'quick' || 'full' }}
        run: |
          python -m pip install -r scripts/requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installing scripts/requirements-test.txt failed.' }
          if ($env:PACKAGE_MODE -eq 'quick') { ./scripts/Test-OfflinePackage.ps1 -Quick } else { ./scripts/Test-OfflinePackage.ps1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: portable-package-validation
          path: |
            artifacts/offline-package/*/result.json
            artifacts/offline-package/*/validation.log
            artifacts/offline-package/*/original/verification.json
            artifacts/offline-package/*/relocated/verification.json
            artifacts/offline-package/*/runtime-session-mcp/*.json
            artifacts/offline-package/*/hmi-component-mcp/*.json
            artifacts/offline-package/*/hmi-component-mcp/host-artifacts/hmi-component-reviews/**
            artifacts/offline-package/*/hmi-component-mcp/host-artifacts/project-reviews/**
            artifacts/offline-package/*/runtime-session-mcp/store/**
            artifacts/offline-package/*/access/capture-handoff/**
            artifacts/offline-package/*/access/runtime-captures/**
            artifacts/offline-package/*/addin-receiver-host/*.json
            artifacts/offline-package/*/composite-engineering/**
            artifacts/offline-package/*/access/handoff/**
            artifacts/offline-package/*/access/handoff-workflow/**
            artifacts/offline-package/*/access/runtime-handoff/**
            artifacts/offline-package/*/access/access-reviews/**
            artifacts/offline-package/*/access/project-reviews/**
            artifacts/offline-package/*/runtime-handoff-mcp/store/runtime-handoff/**
            artifacts/offline-package/*/runtime-handoff-mcp/store/access-reviews/**
            artifacts/offline-package/*/runtime-handoff-mcp/store/project-reviews/**
            artifacts/offline-package/*/access/handoff-child-*.log
            artifacts/offline-package/*/access/verification.json
            artifacts/offline-package/*/drive-profiles/verification.json
            artifacts/offline-package/*/drive-profiles/telegrams-v2/**
            artifacts/offline-package/*/technology-profiles/verification.json
            artifacts/offline-package/*/technology-profiles/encoders-v4/**
            artifacts/offline-package/*/*-mcp/verification.json
            artifacts/offline-package/*/*-mcp/result.json
            artifacts/offline-package/*/credentials/recovery/verification.json
            artifacts/offline-package/*/credentials/operations/verification.json
            artifacts/offline-package/*/credentials/verification.json
            artifacts/offline-package/*/credential-cli/verification.json
            artifacts/releases/*.zip
            artifacts/releases/*.zip.sha256
          retention-days: 14

  workers:
    name: Worker compile without Siemens
    needs: changes
    # Runs for docs-only changes too (steps skipped) so the check always reports and can be required.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            .packages
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', 'global.json', 'NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          dotnet-version: '10.0.402' # Published SDK; avoid unavailable latestFeature redirects.
      - name: Compile the Siemens-dependent workers
        if: needs.changes.outputs.code == 'true'
        shell: pwsh
        # Fails on every compiler error that missing Siemens assemblies cannot explain (see the script header).
        run: ./scripts/Test-WorkerCompile.ps1 -WorkDirectory "$env:RUNNER_TEMP/worker-compile"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ needs.changes.outputs.code == 'true' && !cancelled() }}
        with:
          name: worker-compile
          path: ${{ runner.temp }}/worker-compile/*.log
          retention-days: 14

  opcua:
    name: OPC UA isolated parser and CLI
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .packages
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', 'global.json', 'NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.402' # Published SDK; avoid unavailable latestFeature redirects.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Run isolated OPC UA validation
        shell: pwsh
        run: ./scripts/Test-OpcUaOffline.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: opcua-validation
          path: artifacts/opcua-offline/
          retention-days: 14
