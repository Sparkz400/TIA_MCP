name: Documentation
description: Report missing, wrong or unclear documentation
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Page or section
      placeholder: e.g. docs/guides/engineering-workflows.md#...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, wrong or unclear?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
