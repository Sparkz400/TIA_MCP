labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like TIA MCP to do?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does it solve for you, and how do you handle it today?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: TIA/PLCSIM versions, device types, MCP clients or related tools involved.
